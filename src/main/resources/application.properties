spring.application.name=langchain4j-mongodb-memory
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/langchain4j}

# Ollama Configuration
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3:latest}

# Logging
logging.level.root=INFO
logging.level.com.langchain4j.memory=DEBUG

# Server Configuration
server.servlet.context-path=/
